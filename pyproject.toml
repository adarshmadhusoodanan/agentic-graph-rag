[project]
name = "agentic-graph-rag"
version = "0.1.0"
description = "Agentic RAG that fuses vector search and knowledge graph retrieval, orchestrated with LangGraph and evaluated with RAGAS."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.19.0",
    "neo4j>=6.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.0",
]
