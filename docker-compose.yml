services:
  neo4j:
    image: neo4j:5.26-community
    container_name: agentic-rag-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # browser ui : http://localhost:7474
      - "7687:7687"   # bolt : http://localhost:7687
    environment:
      NEO4J_AUTH: neo4j/changeme-dev-password
      NEO4J_dbms_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: agentic-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # HTTP : http://localhost:6333
      - "6334:6334"   # gRPC : http://localhost:6334
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_storage: